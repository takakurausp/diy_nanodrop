; PlatformIO project for the ESP32 + 2.8" ST7789 LCD board
;   ideaspark ESP32 2.8-inch IPS LCD (240x320, ST7789)  (ESP32-WROOM-32, 16MB flash)
;
; Build with:  pio run
; Upload with: pio run -t upload

[platformio]
; The Arduino sketch lives at the repo root (nanodrop.ino / main.cpp).
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Only compile the sketch; ignore the vendored AVR libraries/ tree at the root.
build_src_filter = +<*> -<libraries/> -<build_lgt8f/>

; Board has 16MB flash.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1
    paulstoffregen/XPT2046_Touchscreen@^1.4

monitor_speed = 115200
upload_speed = 921600

; Sensor selection (defaults are in nanodrop.ino):
;   SG01S-C18 + TIA + ADS1115 (default): -DSENSOR_AS7331=0 -DPD_USE_ADS1115=1
;   SG01S-C18 + TIA + ESP32 ADC:         -DSENSOR_AS7331=0 -DPD_USE_ADS1115=0
;   AS7331:                              -DSENSOR_AS7331=1
